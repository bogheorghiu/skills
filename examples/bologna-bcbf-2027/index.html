<style>
:root{
  --bg:#f3f5f4;--paper:#fff;--ink:#15262f;--ink2:#4a5b63;--line:#d7dfdd;
  --accent:#0f6b6b;--accent-soft:#d8ecea;--warm:#c7861a;--warm-soft:#f6ead2;--bnb:#5a6fa0;
  --ok:#2f7d4a;--unres:#a86b00;--bad:#b3372c;--street:#e4e9e7;--ringfill:rgba(199,134,26,.07);--road:#e2e7e5;--road2:#c9d2cf;--ringroad:#d9a24a;--rail:#8b9794;--rlyfill:rgba(120,130,128,.10);--fierafill:rgba(199,134,26,.16);--iso:#2f7d4a;
  --f-d:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-b:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-m:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0f1719;--paper:#162124;--ink:#e4ecea;--ink2:#9fb0b1;--line:#2a3a3d;
  --accent:#5cc2bb;--accent-soft:#18383a;--warm:#e0a849;--warm-soft:#3a2e17;--bnb:#8fa3d6;
  --ok:#6cc48a;--unres:#e0a849;--bad:#ef7b6e;--street:#1d2b2e;--ringfill:rgba(224,168,73,.08);--road:#233235;--road2:#34474a;--ringroad:#a8792c;--rail:#6c7b7c;--rlyfill:rgba(160,170,168,.07);--fierafill:rgba(224,168,73,.16);--iso:#6cc48a;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0f1719;--paper:#162124;--ink:#e4ecea;--ink2:#9fb0b1;--line:#2a3a3d;
  --accent:#5cc2bb;--accent-soft:#18383a;--warm:#e0a849;--warm-soft:#3a2e17;--bnb:#8fa3d6;
  --ok:#6cc48a;--unres:#e0a849;--bad:#ef7b6e;--street:#1d2b2e;--ringfill:rgba(224,168,73,.08);--road:#233235;--road2:#34474a;--ringroad:#a8792c;--rail:#6c7b7c;--rlyfill:rgba(160,170,168,.07);--fierafill:rgba(224,168,73,.16);--iso:#6cc48a;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 64px;display:flex;flex-direction:column;gap:34px}
h1,h2,h3{font-family:var(--f-d);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,4.4vw,42px);font-weight:700}
h2{font-size:21px;font-weight:700}
h3{font-size:16px;font-weight:600}
.eyebrow{font-family:var(--f-m);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.lede{color:var(--ink2);max-width:70ch;margin:8px 0 0}
a{color:var(--accent)}
section{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px}
.pad{padding:16px 18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.lang button{font:600 12.5px var(--f-m);padding:7px 12px;border:0;background:transparent;color:var(--ink2);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.demo{font-size:13px;color:var(--ink2);border-left:3px solid var(--warm);padding-left:10px;max-width:80ch}
.tl{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.day{padding:10px 8px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-height:88px}
.day .d{font:12px var(--f-m);color:var(--ink2)}.day .n{font:700 22px var(--f-d)}.day .t{font-size:12.5px;line-height:1.3}
.day.fair{background:var(--accent-soft);border-color:transparent}.day.fly{background:var(--warm-soft);border-color:transparent}
@media (max-width:640px){.tl{grid-template-columns:repeat(4,minmax(0,1fr))}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.insight{font-size:16px;max-width:74ch}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:500 13px/1 var(--f-b);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible,.lang button:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
.controls .lab{font-size:12.5px;color:var(--ink2)}
.mapbox{padding:8px;overflow:hidden}
#map{display:block;width:100%;height:auto;max-width:100%}
#map text{font-family:var(--f-b)}
#map .pin{cursor:pointer}
#map .pin:focus{outline:none}
#map .pin:focus-visible .shape{stroke:var(--warm);stroke-width:3.5}
#map .dim{opacity:.22}
.chart{padding:14px 16px 10px;overflow-x:auto}
.bars{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:6px 12px;align-items:center;min-width:520px}
.bars .lbl{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .lbl b{font:600 13px var(--f-m);margin-right:6px;color:var(--ink2)}
.track{position:relative;height:22px}
.bar{position:absolute;left:0;top:3px;height:16px;border-radius:3px;background:var(--accent)}
.bar.room{background:var(--warm)}.bar.bnb{background:var(--bnb)}
.bar.out{background:transparent;border:2px solid var(--bad)}
.val{position:absolute;top:2px;font:600 12px/18px var(--f-m);white-space:nowrap}
.val span{color:var(--ink2);font-weight:400}
.axis{grid-column:2;position:relative;height:18px;border-top:1px solid var(--line);font:11px var(--f-m);color:var(--ink2)}
.axis span{position:absolute;top:3px;transform:translateX(-50%)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.card.sel{border-color:var(--warm);box-shadow:0 0 0 2px var(--warm)}
.ch{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--paper);display:grid;place-items:center;font:600 12px var(--f-m)}
.num.bk{border-radius:7px}.num.out{background:transparent;color:var(--bad);border:2px solid var(--bad)}
.meta{font-size:12.5px;color:var(--ink2)}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price .big{font:700 24px/1 var(--f-d)}.price .per{font:12.5px var(--f-m);color:var(--ink2)}
dl.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13px;margin:0}
dl.facts dt{color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
dl.facts dd{margin:0;font-family:var(--f-m);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;padding:3px 8px;border-radius:5px;background:var(--bg);border:1px solid var(--line)}
.tag.good{border-color:var(--ok);color:var(--ok)}.tag.warn{border-color:var(--unres);color:var(--unres)}.tag.bad{border-color:var(--bad);color:var(--bad)}
.note{font-size:12.5px;color:var(--ink2);border-left:3px solid var(--line);padding-left:10px}
.note.u{border-color:var(--unres)}.note.x{border-color:var(--bad)}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:auto;font-size:13.5px;font-weight:600}
.links a{text-decoration:none}.links a:hover{text-decoration:underline}
.st{font:600 10.5px var(--f-m);letter-spacing:.04em;padding:2px 6px;border-radius:4px;white-space:nowrap}
.st.g{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.st.u{background:color-mix(in srgb,var(--unres) 18%,transparent);color:var(--unres)}
.st.gap{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:540px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600}
td.n{font-family:var(--f-m);white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.bar.hatch{background:repeating-linear-gradient(45deg,var(--bnb) 0 3px,transparent 3px 7px);border:1px solid var(--bnb);opacity:.75}
.links .showmap{font:600 13.5px var(--f-b);color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.links .showmap:hover{text-decoration:underline}.links .showmap:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
#scatter{display:block;width:100%;height:auto}#scatter text{font-family:var(--f-b)}#scatter .pin{cursor:pointer}#scatter .dim{opacity:.22}
#scatter .pin:focus{outline:none}#scatter .pin:focus-visible circle,#scatter .pin:focus-visible rect{stroke:var(--warm);stroke-width:3.5}
@media (max-width:640px){.mapbox{padding:4px}}
.route{margin:0;font-size:14px;border-left:3px solid var(--warm);padding-left:10px;min-height:1.5em}
</style>

</head><body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1 data-i="title"></h1>
      <p class="lede" data-i="lede"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button id="l-en" aria-pressed="true">EN</button><button id="l-ro" aria-pressed="false">RO</button>
    </div>
  </header>
  <p class="demo" data-i="demo"></p>

  <section><h2 data-i="h_cal"></h2><div class="tl" id="tl"></div>
    <div class="legend"><span><i class="sw" style="background:var(--warm-soft);border:1px solid var(--warm)"></i><span data-i="lg_fly"></span></span><span><i class="sw" style="background:var(--accent-soft);border:1px solid var(--accent)"></i><span data-i="lg_fair"></span></span><span data-i="lg_nights"></span></div>
  </section>

  <section><h2 data-i="h_key"></h2><div class="panel pad insight" id="insight"></div></section>

  <section><h2 data-i="h_map"></h2>
    <div class="controls" role="group"><span class="lab" data-i="show"></span>
      <button class="chip" id="f-all" aria-pressed="true"></button>
      <button class="chip" id="f-in" aria-pressed="false" data-i="f_in"></button>
      <button class="chip" id="f-apt" aria-pressed="false" data-i="f_apt"></button>
    </div>
    <p class="route" id="route" aria-live="polite"></p>
    <div class="panel mapbox"><svg id="map" role="img" aria-labelledby="maptitle"><title id="maptitle">Schematic map</title></svg></div>
    <div class="legend">
      <span><svg width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="var(--accent)"/></svg> <span data-i="lg_in"></span></span>
      <span><svg width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="var(--paper)" stroke="var(--bad)" stroke-width="2"/></svg> <span data-i="lg_out"></span></span>
      <span><svg width="16" height="16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3" fill="var(--accent)"/></svg> <span data-i="lg_shape"></span></span>
      <span><svg width="24" height="10" aria-hidden="true"><line x1="0" y1="5" x2="24" y2="5" stroke="var(--ringroad)" stroke-width="4" stroke-linecap="round"/></svg> <span data-i="lg_ring"></span></span>
      <span><svg width="24" height="10" aria-hidden="true"><line x1="0" y1="5" x2="24" y2="5" stroke="var(--warm)" stroke-width="3.5" stroke-linecap="round"/></svg> <span data-i="lg_iso"></span></span>
      <span><svg width="16" height="16" aria-hidden="true"><rect x="1" y="3" width="14" height="10" fill="var(--fierafill)" stroke="var(--warm)"/><circle cx="8" cy="8" r="3.5" fill="var(--warm)"/></svg> <span data-i="lg_fiera"></span></span>
    </div>
    <p class="meta" data-i="map_note"></p>
  </section>

  <section><h2 data-i="h_scatter"></h2>
    <div class="panel chart"><svg id="scatter" role="img" aria-label=""></svg><p class="meta" style="margin:6px 0 0" data-i="sc_note"></p></div>
  </section>

  <section><h2 data-i="h_price"></h2>
    <div class="panel chart"><div class="bars" id="bars"></div>
      <div class="legend" style="padding-top:8px">
        <span><i class="sw" style="background:var(--accent)"></i><span data-i="k_apt"></span></span>
        <span><i class="sw" style="background:var(--warm)"></i><span data-i="k_room"></span></span>
        <span><i class="sw" style="background:var(--bnb)"></i><span data-i="k_bnb"></span></span>
        <span><i class="sw" style="border:2px solid var(--bad)"></i><span data-i="lg_out"></span></span>
        <span><i class="sw" style="background:repeating-linear-gradient(45deg,var(--bnb) 0 2px,transparent 2px 5px);border:1px solid var(--bnb)"></i><span data-i="k_hatch"></span></span>
      </div></div>
  </section>

  <section><h2 data-i="h_list"></h2>
    <div class="controls" role="group"><span class="lab" data-i="sort"></span>
      <button class="chip" id="s-price" aria-pressed="true" data-i="s_price"></button>
      <button class="chip" id="s-fiera" aria-pressed="false" data-i="s_fiera"></button>
      <button class="chip" id="s-rating" aria-pressed="false" data-i="s_rating"></button>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <section><h2 data-i="h_fly"></h2>
    <div class="two">
      <div class="panel tw"><table><thead><tr><th></th><th data-i="t_out"></th><th data-i="t_back"></th><th data-i="t_base"></th></tr></thead>
        <tbody><tr><td><b>Wizz Air</b></td><td class="n">179 RON (~35 €)</td><td class="n">49.99 €</td><td class="n"><b>~85 €</b></td></tr>
        <tr><td>Ryanair</td><td class="n">127.99 € · 09:50</td><td class="n">63.99 € · 06:25</td><td class="n">~192 €</td></tr></tbody></table>
        <div class="pad meta" data-i="fly_note"></div></div>
      <div class="panel pad"><h3 style="margin-bottom:10px" data-i="h_hidden"></h3><ul class="clean" id="hidden"></ul></div>
    </div>
  </section>

  <section><h2 data-i="h_notes"></h2>
    <div class="two">
      <div class="panel pad"><h3 style="margin-bottom:10px" data-i="h_tax"></h3><ul class="clean" id="taxnotes"></ul></div>
      <div class="panel pad"><h3 style="margin-bottom:10px" data-i="h_move"></h3><ul class="clean" id="movenotes"></ul></div>
    </div>
    <p class="meta" id="sources"></p>
  </section>
</div>

<script src="streets.js"></script>

  const v=new Set(vis().map(x=>x.id));
  const r0=narrow?9:11,Q={};L.forEach(x=>Q[x.id]=[X(x.walk),Y(x.total)]);
  for(let it=0;it<60;it++)for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const A=Q[L[i].id],B=Q[L[j].id];let dx=B[0]-A[0],dy=B[1]-A[1],d=Math.hypot(dx,dy)||.01,m=2*r0+2-d;if(m>0){dx/=d;dy/=d;A[0]-=dx*m/2;A[1]-=dy*m/2;B[0]+=dx*m/2;B[1]+=dy*m/2;}}
  for(const x of L){const [px,py]=Q[x.id],tx=X(x.walk),ty=Y(x.total),out=!x.inside,bk=x.src==='Booking',r=r0;
    if(Math.hypot(px-tx,py-ty)>3)s+=`<line x1="${tx}" y1="${ty}" x2="${px}" y2="${py}" stroke="var(--ink2)" stroke-width="1"/><circle cx="${tx}" cy="${ty}" r="2" fill="var(--ink2)"/>`;
    const fill=out?'var(--paper)':'var(--accent)',stroke=out?'var(--bad)':'var(--paper)',tc=out?'var(--bad)':'var(--paper)';
    const sh=bk?`<rect x="${px-r}" y="${py-r}" width="${2*r}" height="${2*r}" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`:`<circle cx="${px}" cy="${py}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
    const sel=selected===x.id?`<circle cx="${px}" cy="${py}" r="${r+6}" fill="none" stroke="var(--warm)" stroke-width="3"/>`:'';
    s+=`<g class="pin${v.has(x.id)?'':' dim'}" tabindex="0" role="button" data-id="${x.id}" aria-label="${x.n}. ${x.name.replace(/"/g,'')}: ${eur(x.total)}, ~${x.walk} min">${sel}${sh}<text x="${px}" y="${py+4}" text-anchor="middle" font-size="${narrow?10:11}" font-weight="700" font-family="JetBrains Mono, monospace" fill="${tc}">${x.n}</text></g>`;}
  svg.setAttribute('viewBox',`0 0 ${Wd} ${Hd}`);svg.setAttribute('aria-label',t.h_scatter);svg.innerHTML=s;
  svg.querySelectorAll('.pin').forEach(g=>{const go=()=>select(g.dataset.id,true);g.addEventListener('click',go);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});});
}
function barClass(x){return !x.inside?'out':(x.src==='Booking'?'bnb':(isApt(x)?'':'room'))}
function drawBars(){
  const t=T[lang],list=vis().slice().sort((a,b)=>a.total-b.total),max=Math.ceil(Math.max(...L.map(x=>x.total))*1.3/250)*250,ticks=[];
  for(let v=0;v<=max;v+=500)ticks.push(v);
  $('#bars').innerHTML=list.map(x=>{const w=x.total/max*100;const split=x.src==='Booking'&&x.displayed&&x.displayed<x.total&&x.inside;const w1=split?x.displayed/max*100:w;return `<div class="lbl" title="${x.name}"><b>${x.n}</b>${x.name}</div><div class="track"><div class="bar ${barClass(x)}" style="width:${w1}%"></div>${split?`<div class="bar hatch" style="left:${w1}%;width:${w-w1}%" title="${t.bkgap}"></div>`:''}<span class="val" style="left:calc(${w}% + 6px)">${eur(x.total)} <span>· ${eur(x.night)}${t.per}</span></span></div>`}).join('')+
  `<div class="axis">${ticks.map(v=>`<span style="left:${v/max*100}%">${v?eur(v):'0'}</span>`).join('')}</div>`;
}
function card(x){
  const t=T[lang],d=dirs[lang];
  const rt=x.rating?`${String(x.rating).replace('.',lang==='ro'?',':'.')}${x.scale===5?'/5':'/10'} · ${x.reviews} ${t.rev}`:t.norate;
  const tags=[x.inside?`<span class="tag good">${t.in}</span>`:`<span class="tag bad">${t.out}</span>`,`<span class="tag">${x.dir==='Due Torri'?t.nearT:(lang==='ro'?'la '+d[x.dir]+' '+t.of:d[x.dir]+' '+t.of)}</span>`];
  if(x.kitchen)tags.push(`<span class="tag">${t.kitchen}</span>`);if(x.ac)tags.push(`<span class="tag">${t.ac}</span>`);if(x.lift)tags.push(`<span class="tag">${t.lift}</span>`);
  if(x.fc)tags.push(`<span class="tag good">${t.fc}${eur(x.fc)}</span>`);else if(x.src==='Booking')tags.push(`<span class="tag warn">${t.nonref}</span>`);
  if(x.reviews!==null&&x.reviews<5)tags.push(`<span class="tag warn">${t.thin}</span>`);
  const [note,cls]=taxNote(x,t);
  const osm=`https://www.openstreetmap.org/?mlat=${x.lat}&mlon=${x.lng}#map=17/${x.lat}/${x.lng}`;
  const numc=(x.inside?'':' out')+(x.src==='Booking'?' bk':'');
  return `<article class="card${selected===x.id?' sel':''}" id="c-${x.id}">
    <div class="ch"><span class="num${numc}">${x.n}</span><div><h3>${x.name}</h3><div class="meta">${x.src} · ${t.kinds[x.kind]}${x.details.length?' · '+x.details.join(' · '):''}</div></div></div>
    <div class="price"><span class="big">${eur(x.total)}</span><span class="per">${eur(x.night)}${t.per} · ${eur(x.total/2)}${t.pp}</span></div>
    <dl class="facts"><div><dt>${t.toFair}</dt><dd>~${x.walk} ${t.walk} · ${dec(x.dF)} ${t.km}</dd></div><div><dt>${t.rating}</dt><dd>${rt}</dd></div><div><dt>${t.src}</dt><dd>${x.src}, 24.09.2026</dd></div></dl>
    <div class="tags">${tags.join('')}</div>
    <div class="note ${cls}">${note}</div>
    <div class="links"><a href="${x.url}" target="_blank" rel="noopener">${t.open}${x.src} ↗</a><button class="showmap" data-id="${x.id}">${t.showmap}</button><a href="${osm}" target="_blank" rel="noopener">${t.osm}</a></div></article>`;
}
function drawCards(){const s={price:(a,b)=>a.total-b.total,fiera:(a,b)=>a.dF-b.dF,rating:(a,b)=>(b.rating/b.scale)-(a.rating/a.scale)}[sortBy];$('#cards').innerHTML=vis().slice().sort(s).map(card).join('');
  document.querySelectorAll('.showmap').forEach(b=>b.addEventListener('click',()=>{select(b.dataset.id,false);$('#map').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});}));}
function select(id,scroll){selected=id;drawMap();drawScatter();document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',c.id==='c-'+id));const c=document.getElementById('c-'+id);if(scroll&&c)c.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});}
const li=(arr)=>arr.map(([txt,c,lab])=>`<li>${txt}${c?` <span class="st ${c}">${lab}</span>`:''}</li>`).join('');
function render(){
  const t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const v=t[e.dataset.i];if(typeof v==='string')e.textContent=v;});
  $('#f-all').textContent=`${t.all} (${L.length})`;
  $('#tl').innerHTML=t.days.map(d=>`<div class="day ${d[3]}"><span class="d">${d[0]} · ${lang==='ro'?'apr.':'Apr'}</span><span class="n">${d[1]}</span><span class="t">${d[2]}</span></div>`).join('');
  const ins=L.filter(x=>x.inside),a=ins.filter(isApt).map(x=>x.total),r=ins.filter(x=>x.kind==='room').map(x=>x.total);
  const near=ins.filter(isApt).sort((p,q)=>p.walk-q.walk)[0],outs=L.filter(x=>!x.inside&&isApt(x)).sort((p,q)=>p.walk-q.walk)[0];
  $('#insight').innerHTML=t.insight(`${eur(Math.min(...a))}–${eur(Math.max(...a))}`,`${eur(Math.min(...r))}–${eur(Math.max(...r))}`,near,outs);
  $('#hidden').innerHTML=li(t.hidden.map(h=>[h[0],h[1],h[2]]));
  $('#taxnotes').innerHTML=li(t.taxnotes.map(h=>[h[0],h[1],h[2]]));
  $('#movenotes').innerHTML=li(t.movenotes.map(h=>[h[0],h[1],h[2]]));
  $('#sources').textContent=t.sources;
  drawMap();drawScatter();drawBars();drawCards();
}
function grp(ids,a){ids.forEach(i=>$('#'+i).setAttribute('aria-pressed',String(i===a)))}
[['l-en','en'],['l-ro','ro']].forEach(([i,v])=>$('#'+i).addEventListener('click',()=>{lang=v;grp(['l-en','l-ro'],i);try{localStorage.setItem('ts-lang',v)}catch(e){}render();}));
[['f-all','all'],['f-in','in'],['f-apt','apt']].forEach(([i,v])=>$('#'+i).addEventListener('click',()=>{filter=v;grp(['f-all','f-in','f-apt'],i);drawMap();drawScatter();drawBars();drawCards();}));
[['s-price','price'],['s-fiera','fiera'],['s-rating','rating']].forEach(([i,v])=>$('#'+i).addEventListener('click',()=>{sortBy=v;grp(['s-price','s-fiera','s-rating'],i);drawCards();}));
try{const s=localStorage.getItem('ts-lang');if(s==='ro'){lang='ro';grp(['l-en','l-ro'],'l-ro');}}catch(e){}
render();
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{drawMap();drawScatter();},150);});
})();
</script>

</body></html>
